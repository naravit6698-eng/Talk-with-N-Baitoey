<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>น้องใบเตย AR ทายพยัญชนะไทย</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:linear-gradient(#5f9ea0,#1d2b3a);overflow:hidden;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video.m{transform:scaleX(-1)}
#bub{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#fff;border-radius:18px;padding:12px 16px;font-size:clamp(17px,4.6vw,26px);font-weight:700;color:#222;text-align:center;box-shadow:0 4px 14px #0006;min-height:1.4em}
#emo{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(70px,22vw,140px);text-shadow:0 4px 12px #0008;pointer-events:none}
#pan{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:10px;justify-content:center;padding:14px;flex-wrap:wrap}
button{font:inherit;font-size:22px;border:0;border-radius:16px;padding:12px 26px;background:#fff;color:#222;font-weight:800;box-shadow:0 3px 10px #0005}
button.ok{background:#69db7c}button.no{background:#ff8787}
#go{background:#ffd43b;font-size:26px}
#top{position:absolute;right:10px;top:38%;display:flex;flex-direction:column;gap:8px}
#top button{font-size:15px;padding:8px 12px}
</style></head><body>
<video id="v" class="m" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="bub">แตะ “เริ่ม” เพื่อคุยกับน้องใบเตย</div>
<div id="emo"></div>
<div id="top"><button id="flip">🔄 สลับกล้อง</button></div>
<div id="pan"><button id="go">▶ เริ่ม</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const Q=[['🐔','ไก่','ก'],['🥚','ไข่','ข'],['🐍','งู','ง'],['🐘','ช้าง','ช'],['🐴','ม้า','ม']];
const LET=['ก','ข','ง','ช','ม'];
// ---------- camera ----------
let face='user',stream;
async function cam(){try{stream&&stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false});
 $('v').srcObject=stream;$('v').classList.toggle('m',face==='user')}catch(e){}}
cam();$('flip').onclick=()=>{face=face==='user'?'environment':'user';cam()};
// ---------- 3D girl ----------
const R=new THREE.WebGLRenderer({canvas:$('c'),alpha:true,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,50);
C.position.set(0,1.1,5);C.lookAt(0,1.0,0);
S.add(new THREE.HemisphereLight(0xffffff,0x888899,1.1));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,4,4);S.add(dl);
const mat=(c)=>new THREE.MeshToonMaterial({color:c});
const mk=(g,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(g,mat(c));m.position.set(x,y,z);return m};
const girl=new THREE.Group(),body=new THREE.Group();girl.add(body);
const skin=0xffd9bd,hair=0x4a2c1a,dress=0xff7eb6;
body.add(mk(new THREE.CylinderGeometry(.2,.46,.85,24),dress,0,.62,0));
body.add(mk(new THREE.CylinderGeometry(.47,.47,.06,24),0xffffff,0,.2,0));
for(const x of[-.14,.14]){body.add(mk(new THREE.CylinderGeometry(.06,.06,.3,10),skin,x,.05,0));body.add(mk(new THREE.SphereGeometry(.1,12,10),0x8b3a3a,x,-.1,.03))}
const head=new THREE.Group();head.position.y=1.5;body.add(head);
head.add(mk(new THREE.SphereGeometry(.5,32,24),skin));
const back=mk(new THREE.SphereGeometry(.53,32,24),hair,0,.02,-.06);back.scale.set(1,1.02,.95);head.add(back);
const fr=mk(new THREE.SphereGeometry(.53,32,16,0,Math.PI*2,0,Math.PI*.42),hair,0,.02,.02);fr.rotation.x=-.18;head.add(fr);
for(const s of[-1,1]){
 head.add(mk(new THREE.SphereGeometry(.17,16,12),hair,s*.55,-.12,-.05));
 head.add(mk(new THREE.SphereGeometry(.07,10,8),0xe03131,s*.42,.28,.2));
 const e=mk(new THREE.SphereGeometry(.075,16,12),0x1a1a1a,s*.18,-.02,.46);e.scale.set(1,1.3,.5);e.name='eye';head.add(e);
 head.add(mk(new THREE.SphereGeometry(.025,8,8),0xffffff,s*.18+.02,.02,.5));
 const ch=mk(new THREE.SphereGeometry(.06,12,8),0xffa8a8,s*.3,-.16,.42);ch.scale.set(1,.6,.4);head.add(ch);
}
const mouth=mk(new THREE.SphereGeometry(.06,12,8),0xd6336c,0,-.22,.47);mouth.scale.set(1,.45,.4);head.add(mouth);
const arms=[];
for(const s of[-1,1]){const a=new THREE.Group();a.position.set(s*.27,1.05,0);
 a.add(mk(new THREE.CylinderGeometry(.06,.06,.5,10),skin,0,-.25,0));a.add(mk(new THREE.SphereGeometry(.08,12,10),skin,0,-.52,0));
 a.rotation.z=s*.3;body.add(a);arms.push(a)}
S.add(girl);
function resize(){R.setSize(innerWidth,innerHeight,false);const a=innerWidth/innerHeight;C.aspect=a;C.updateProjectionMatrix();
 const hw=5*Math.tan(20*Math.PI/180)*a;const s=Math.min(1,hw/1.1);girl.scale.setScalar(s);girl.position.set(hw*.55-.1*s,-.15,0)}
addEventListener('resize',resize);resize();
// ---------- state / animation ----------
let mood='idle',moodT=0,talking=false;
const setMood=m=>{mood=m;moodT=0};
(function loop(){requestAnimationFrame(loop);const t=performance.now()/1000;moodT+=1/60;
 body.position.y=Math.sin(t*2)*.03;body.rotation.z=0;head.rotation.z=Math.sin(t*1.3)*.05;head.rotation.y=Math.sin(t*.8)*.15-.1;
 arms[0].rotation.z=-.3;arms[1].rotation.z=.3;arms[1].rotation.x=0;
 const blink=(t%3.2)<.12?.1:1;head.children.forEach(c=>{if(c.name==='eye')c.scale.y=1.3*blink});
 mouth.scale.y=talking?.25+Math.abs(Math.sin(t*14))*.6:.45;
 if(mood==='wave'){arms[1].rotation.z=2.4+Math.sin(t*10)*.3;if(moodT>2.2)setMood('idle')}
 if(mood==='happy'){body.position.y=Math.abs(Math.sin(moodT*8))*.35;arms[0].rotation.z=-2.6;arms[1].rotation.z=2.6;mouth.scale.set(1.6,.9,.4);if(moodT>2)setMood('idle')}
 if(mood==='sad'){head.rotation.y=Math.sin(moodT*18)*.35;head.rotation.z=.15;if(moodT>1.2)setMood('idle')}
 R.render(S,C)})();
// ---------- speech ----------
function say(text,cb){$('bub').textContent=text;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=.9;u.pitch=1.4;
  let done=false;const fin=()=>{if(done)return;done=true;talking=false;cb&&cb()};
  u.onstart=()=>talking=true;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
  setTimeout(fin,Math.max(2500,text.length*130));talking=true}
 catch(e){setTimeout(()=>cb&&cb(),2500)}}
// ---------- quiz ----------
let qi=0,score=0,tries=0;
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function ask(){
 const [e,w,l]=Q[qi];tries=0;$('emo').textContent=e;$('pan').innerHTML='';
 say(`ข้อ ${qi+1} ค่ะ ${w} ขึ้นต้นด้วยพยัญชนะตัวไหนเอ่ย`,()=>{
  shuffle([l,...shuffle(LET.filter(x=>x!==l)).slice(0,2)]).forEach(x=>{
   const b=document.createElement('button');b.textContent=x;b.onclick=()=>pick(b,x===l,l);$('pan').appendChild(b)})});
 // show buttons immediately too
 setTimeout(()=>{if(!$('pan').children.length)$('pan').innerHTML='',shuffle([l,...shuffle(LET.filter(x=>x!==l)).slice(0,2)]).forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>pick(b,x===l,l);$('pan').appendChild(b)})},600);
}
function pick(b,ok,l){
 if(ok){if(!tries)score++;setMood('happy');[...$('pan').children].forEach(x=>x.disabled=true);b.classList.add('ok');
  say(`ถูกต้องค่ะ ${l} ${Q[qi][1]} เก่งมาก`,()=>{qi++;qi<Q.length?ask():end()})}
 else{tries++;b.classList.add('no');setMood('sad');say('ยังไม่ใช่ค่ะ ลองอีกทีนะ')}
}
function end(){$('emo').textContent='🎉';setMood('happy');$('pan').innerHTML='<button id="again">เล่นอีกครั้ง</button>';
 $('again').onclick=start;say(`จบแล้วค่ะ คุณตอบถูกตั้งแต่ครั้งแรก ${score} จาก ${Q.length} ข้อ เก่งมากเลย แล้วพบกันใหม่นะคะ`)}
function start(){qi=0;score=0;setMood('wave');
 say('สวัสดีค่ะ หนูชื่อน้องใบเตย วันนี้มาเล่นทายพยัญชนะไทยกันนะคะ',ask)}
$('go').onclick=start;
</script></body></html>
